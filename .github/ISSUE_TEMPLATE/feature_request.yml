name: 功能建议
description: 提出一个新功能或改进想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提出前建议先看一眼 [`docs/plan.md`](https://github.com/CobyLee66/HermesChat/blob/main/docs/plan.md) 与
        [`DECISIONS.md`](https://github.com/CobyLee66/HermesChat/blob/main/DECISIONS.md) ——
        有些想法可能已经实现过、或曾被明确否决并记录了原因。

        另外请注意：本项目是**客户端**，只使用 Hermes Agent 的官方公开协议，
        **不接受需要修改服务端才能实现的需求**。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述使用场景与痛点，而不是直接给实现方案——这样更容易找到更合适的做法
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括你否决它们的原因
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: 主要涉及哪个端（可多选时选最主要的）
      options:
        - 三端通用
        - Android
        - Windows / macOS 桌面端
        - 浏览器
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
        - label: 这个需求不需要修改 Hermes Agent 服务端
          required: true
        - label: 我愿意提交 PR 来实现它
          required: false
