<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Chat</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* RNW AppContainer 根节点是 flex:1，要求 #root 为纵向 flex 容器 */
      #root {
        display: flex;
        flex-direction: column;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'PingFang SC',
          'Helvetica Neue',
          sans-serif;
        background: #f2f3f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // RN 内部库（react-native-web vendored Animated/PerformanceLogger 等）
      // 引用 Node 的裸 global（如 global.cancelAnimationFrame），浏览器/Electron
      // 渲染层没有该变量——动画 stop 时抛 ReferenceError 致整树崩溃。
      // 必须在模块脚本前执行（inline 经典脚本先于 type=module 运行）。
      window.global = window;
    </script>
    <script type="module" src="./index.web.js"></script>
  </body>
</html>
